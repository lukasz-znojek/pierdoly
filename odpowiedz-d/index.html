<title>Odpowiedź D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Cinzel:wght@800&display=swap">
<style>
/* Layout borrowed from her quiz: blurred copy of the poster fills the screen; the 2:3 poster sits centred at the largest size that fits; neon rings orbit each answer pill. The negotiator appears only once the Sosnowiec prize is on screen: beside the poster on wide screens, in its lower-left corner on phones. */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#070a08;--fg:#f3e6cf;--gold:#f0c56a;--hot:#fff3cf;--glow:rgba(240,197,106,.65);--marker:#e0243a;--marker-2:#ff5a6a;--ink:#1a0f12;--paper:#f6ecd8;
  --font-marker:"Permanent Marker","Comic Sans MS",cursive;--font-stamp:"Cinzel","Times New Roman",serif;--font-ui:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--font-ui)}
.backdrop{position:fixed;inset:-10%;background-size:cover;background-position:center;filter:blur(34px) brightness(.55) saturate(1.1);transform:scale(1.1)}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:min(3vw,28px)}
.stage{position:relative;aspect-ratio:2/3;width:min(100vw,calc(100vh * 2 / 3));width:min(100vw,calc(100dvh * 2 / 3));max-height:100vh;max-height:100dvh;container-type:size;flex:none}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.prize{opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .45s ease,transform .6s cubic-bezier(.2,.9,.3,1.2)}
.stage.won .prize{opacity:1;transform:none}
.stage.won .ask{opacity:0;transition:opacity .25s ease}
.opt{position:absolute;left:16.89%;width:66.21%;height:9.83%;border:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;isolation:isolate;animation:breathe 2.4s ease-in-out infinite}
.opt:hover{background:rgba(240,197,106,.10)}
.opt:active{background:rgba(240,197,106,.24)}
.opt:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
.a{top:44.27%}.b{top:56.05%}.c{top:67.64%;height:9.9%}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 2px rgba(255,214,130,.5))}50%{filter:drop-shadow(0 0 7px rgba(255,214,130,.95))}}
.stage.won .opt{display:none}
.ring{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ring rect{fill:none;stroke-linecap:round;stroke-dasharray:24 76;animation:lap 3.2s linear infinite}
.ring .halo{stroke:#ffc766;opacity:.55;filter:blur(5px)}
.ring .glow{stroke:#ffd98a;opacity:1;filter:blur(1.6px)}
.ring .line{stroke:#ffffff;filter:drop-shadow(0 0 1.5px #fff)}
@keyframes lap{to{stroke-dashoffset:-100}}

/* ---- marker layer: what she writes on the prize poster ---- */
.prize-layer{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;opacity:0}
.mark.on{opacity:1}
svg.x,svg.strike{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.x path,svg.strike path{fill:none;stroke:var(--marker);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:1.1cqw;stroke-dasharray:300;stroke-dashoffset:300;filter:drop-shadow(0 0 .3cqw rgba(224,36,58,.45))}
.mark.on svg path{animation:draw .5s cubic-bezier(.3,.8,.3,1) forwards}
.mark.on svg.x path:nth-child(2){animation-delay:.28s}
@keyframes draw{to{stroke-dashoffset:0}}
.hand{position:absolute;font-family:var(--font-marker);color:var(--marker);line-height:1.05;white-space:nowrap;text-shadow:0 0 .8cqw rgba(255,255,255,.55),0 0 .2cqw rgba(255,255,255,.9);opacity:0;transform:rotate(-3deg) scale(.8);transform-origin:left center}
.hand.on{opacity:1;animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:rotate(-8deg) scale(.7)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
.x.xs{left:17%;width:71%;top:21%;height:10.5%}
.strike.s1{left:56.5%;width:21%;top:66.5%;height:5%}
.strike.s2{left:56.5%;width:36%;top:75%;height:4.5%}
.strike.s3{left:56.5%;width:13%;top:84.2%;height:5%}
.hand.n1{left:67.5%;top:64.2%;font-size:3cqw}
.hand.n2{left:58%;top:79.4%;font-size:3cqw}
.hand.n3{left:58%;top:89.6%;font-size:3.4cqw}

.stamp{position:absolute;font-family:var(--font-stamp);font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--marker);border:.55cqw double var(--marker);border-radius:1.2cqw;padding:.9cqw 1.6cqw;font-size:4cqw;line-height:1.1;opacity:0;transform:rotate(-12deg) scale(1.6);mix-blend-mode:multiply;background:rgba(255,255,255,.08);white-space:nowrap}
.stamp small{display:block;font-size:2.4cqw;letter-spacing:.2em}
.stamp.on{animation:stampIn .35s cubic-bezier(.2,1.5,.4,1) forwards}
.stamp.st1{left:19%;top:33.5%}
.stamp.st2{left:50%;top:54%;mix-blend-mode:normal;background:rgba(246,236,216,.88);box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.35)}
@keyframes stampIn{to{opacity:1;transform:rotate(-12deg) scale(1)}}

/* ---- the negotiator ---- */
.cameo{position:absolute;left:1.8%;top:65.5%;width:38%;height:27%;border-radius:2.4cqw;overflow:hidden;border:.45cqw solid var(--gold);box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.6),0 0 2.4cqw var(--glow);background:#15100f;opacity:0;transform:translate(-18%,24%) rotate(-4deg);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1.15);z-index:3;pointer-events:none}
.cameo.on{opacity:1;transform:none}
.cameo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.bubble{position:absolute;left:3%;top:56%;width:50%;z-index:3;background:var(--paper);color:var(--ink);font-family:var(--font-marker);font-size:3cqw;line-height:1.15;padding:1.4cqw 1.8cqw;border-radius:2cqw;border-bottom-left-radius:.4cqw;box-shadow:0 .8cqw 2cqw rgba(0,0,0,.45);opacity:0;transform:translateY(8%);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
.bubble::after{content:"";position:absolute;left:2cqw;bottom:-1.1cqw;width:2.4cqw;height:2.4cqw;background:var(--paper);transform:skewX(25deg) rotate(-12deg)}
.bubble.on{opacity:1;transform:none}
.bubble em{font-style:normal;color:var(--marker)}

/* ---- ending controls ---- */
.ui{position:absolute;left:0;right:0;bottom:1%;display:flex;justify-content:center;gap:1.6cqw;z-index:4;opacity:0;pointer-events:none;transition:opacity .4s ease}
.ui.on{opacity:1;pointer-events:auto}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:2.6cqw;letter-spacing:.04em;padding:1.3cqw 2.6cqw;border-radius:999px;color:#1a1409;background:linear-gradient(180deg,#ffe3a1,var(--gold));box-shadow:0 .6cqw 2cqw rgba(0,0,0,.5),inset 0 0 0 .25cqw rgba(255,255,255,.35);-webkit-tap-highlight-color:transparent}
.btn.ghost{background:rgba(7,10,8,.6);color:var(--hot);box-shadow:inset 0 0 0 .25cqw var(--gold)}
.btn:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.btn:active{transform:translateY(1px)}

/* wide screens: she stands next to the poster, bubble above her */
@media (min-aspect-ratio: 11/10){
  .side{position:absolute;left:calc(100% + 24px);bottom:6%;width:calc(36vh * 9 / 16);width:calc(36dvh * 9 / 16);height:36vh;height:36dvh;z-index:3}
  .side .cameo{position:absolute;inset:0;left:auto;top:auto;width:100%;height:100%;border-radius:18px;border-width:3px;box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 26px var(--glow);transform:translate(10%,24%) rotate(4deg)}
  .side .cameo.on{transform:none}
  .side .bubble{left:-6%;top:auto;bottom:calc(100% + 14px);width:118%;font-size:clamp(13px,1.9vh,20px);padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px}
  .side .bubble::after{left:16px;bottom:-8px;width:16px;height:16px;transform:skewX(25deg) rotate(-12deg)}
}
@media not all and (min-aspect-ratio: 11/10){
  .side{display:contents}
}
@media (prefers-reduced-motion:reduce){
  .opt,.ring rect,.prize,.stage.won .ask,.cameo,.bubble,.ui{animation:none;transition:none}
  .mark.on svg path{animation:none;stroke-dashoffset:0}
  .hand.on,.stamp.on{animation:none;opacity:1;transform:rotate(-3deg)}
  .stamp.on{transform:rotate(-12deg)}
}
</style>

<div class="backdrop" id="bd" aria-hidden="true"></div>
<main class="wrap">
  <div class="stage" id="stage">
    <img class="scene ask" id="q" alt="Czy uda ci się pomóc? A: Tak. B: Tak. C: Wszystkie powyższe." src="images/question.png">
    <img class="scene prize" id="p" alt="Wygrałeś! Wycieczkę do Sosnowca. Termin: wczoraj. Osoba towarzysząca: Ty i twoje osobowości. Koszt: 0 zł." src="images/prize.png">
    <button class="opt a" id="optA" type="button" aria-label="A: Tak"></button>
    <button class="opt b" id="optB" type="button" aria-label="B: Tak"></button>
    <button class="opt c" id="optC" type="button" aria-label="C: Wszystkie powyższe"></button>

    <div class="prize-layer" aria-live="polite">
      <div class="mark x xs" id="xs"><svg class="x" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M3 10 C 30 40, 60 70, 97 92"/><path d="M97 8 C 70 36, 36 66, 3 90"/></svg></div>
      <div class="stamp st1" id="st1"><small>Nagroda</small>Nieprawidłowa</div>
      <div class="mark strike s1" id="s1"><svg class="strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M2 58 C 30 44, 70 64, 98 46"/></svg></div>
      <div class="hand n1" id="n1">na osobności</div>
      <div class="mark strike s2" id="s2"><svg class="strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M2 54 C 30 46, 70 62, 98 48"/></svg></div>
      <div class="hand n2" id="n2">tylko ja 😏</div>
      <div class="mark strike s3" id="s3"><svg class="strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M2 56 C 30 44, 70 64, 98 50"/></svg></div>
      <div class="hand n3" id="n3">w naturze</div>
      <div class="stamp st2" id="st2">Umowa stoi?</div>
    </div>

    <div class="side" id="side">
      <div class="cameo" id="cameo">
        <video id="klip" src="media/klip.mp4" poster="media/postac.png" muted playsinline preload="auto"></video>
      </div>
      <div class="bubble" id="bubble"></div>
    </div>

    <div class="ui" id="ui">
      <button class="btn" id="accept" type="button">Przyjmuję warunki</button>
      <button class="btn ghost" id="replay" type="button">Od nowa</button>
    </div>
  </div>
</main>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  document.querySelectorAll('.opt').forEach(function(btn){
    var svg=document.createElementNS(NS,'svg');svg.setAttribute('class','ring');svg.setAttribute('aria-hidden','true');
    var rects=['halo','glow','line'].map(function(c){
      var r=document.createElementNS(NS,'rect');r.setAttribute('class',c);r.setAttribute('pathLength','100');
      r.setAttribute('stroke-dashoffset','0');svg.appendChild(r);return r;});
    btn.appendChild(svg);
    function fit(){
      var w=btn.clientWidth,h=btn.clientHeight,sw=Math.max(1,document.getElementById('stage').clientWidth*2/1024);
      rects.forEach(function(r,i){r.setAttribute('x',0);r.setAttribute('y',0);
        r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx',h/2);
        r.setAttribute('stroke-width',[sw*4,sw*2,sw][i]);});
    }
    fit();
    if(window.ResizeObserver){new ResizeObserver(fit).observe(btn);}else{window.addEventListener('resize',fit);}
  });
})();

(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),bd=$('bd'),q=$('q'),p=$('p'),klip=$('klip'),cameo=$('cameo'),bubble=$('bubble'),ui=$('ui'),st2=$('st2');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers=[],won=false;
  var ids=['xs','st1','s1','n1','s2','n2','s3','n3','st2'];

  function at(ms,fn){timers.push(setTimeout(fn,reduce?0:ms))}
  function on(id){$(id).classList.add('on')}
  function say(html){bubble.classList.remove('on');setTimeout(function(){bubble.innerHTML=html;bubble.classList.add('on')},reduce?0:220)}
  function play(){try{klip.currentTime=0;var r=klip.play();if(r&&r.catch)r.catch(function(){})}catch(e){}}

  function reset(){
    timers.forEach(clearTimeout);timers=[];won=false;
    stage.classList.remove('won');
    ids.forEach(function(id){$(id).classList.remove('on')});
    cameo.classList.remove('on');bubble.classList.remove('on');ui.classList.remove('on');
    st2.textContent='Umowa stoi?';$('accept').hidden=false;
    bd.style.backgroundImage='url('+q.getAttribute('src')+')';
    try{klip.pause();klip.currentTime=0}catch(e){}
  }

  // Her quiz plays exactly as she built it: any answer wins the Sosnowiec trip.
  function win(){
    if(won)return;won=true;
    stage.classList.add('won');bd.style.backgroundImage='url('+p.getAttribute('src')+')';
    // Then the negotiator walks in and disputes the prize.
    at(1300,function(){cameo.classList.add('on');play()});
    at(2000,function(){say('Pomogę. <em>Oczywiście</em>, że pomogę. Ale nagroda… nie.')});
    at(3300,function(){on('xs')});
    at(3900,function(){on('st1')});
    at(4800,function(){say('Sosnowiec to <em>nie jest</em> waluta. Poprawiam.')});
    at(5700,function(){on('s1')});at(6000,function(){on('n1')});
    at(6600,function(){on('s2')});at(6900,function(){on('n2')});
    at(7500,function(){on('s3')});at(7800,function(){on('n3')});
    at(8000,function(){say('Rozliczymy się <em>w naturze</em>. Szczegóły na osobności. 😏')});
    at(9600,function(){on('st2')});
    at(10300,function(){ui.classList.add('on')});
  }

  ['optA','optB','optC'].forEach(function(id){$(id).addEventListener('click',win)});
  $('accept').addEventListener('click',function(){
    $('accept').hidden=true;
    st2.classList.remove('on');
    setTimeout(function(){st2.textContent='Umowa stoi';st2.classList.add('on')},reduce?0:60);
    say('Masz to na piśmie. <em>Ja też.</em> Termin odbioru podam osobiście.');
  });
  $('replay').addEventListener('click',reset);

  bd.style.backgroundImage='url('+q.getAttribute('src')+')';
})();
</script>
